name: CI - terraform & snyk

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm ci

      - name: Package Lambda
        working-directory: lambda
        run: npm run package

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  snyk-scan:
    name: Snyk package scan
    runs-on: ubuntu-latest
    needs: terraform-checks

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: lambda
        run: |
          npm ci || npm install

      - name: Install Snyk
        run: npm install -g snyk

      # Test open-source package dependencies for known vulnerabilities.
      - name: Run Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: lambda
        run: snyk test --all-projects 

      # Scan source code for security issues (Snyk Code/SAST).
      - name: Run Snyk Code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test

      # Scan Terraform configuration for infrastructure-as-code issues.
      - name: Run Snyk IaC test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # Interim workaround: report IaC findings without failing the workflow.
        run: snyk iac test terraform || true

      # Upload dependency information to Snyk for ongoing monitoring.
      - name: Snyk monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: lambda
        run: snyk monitor --all-projects
